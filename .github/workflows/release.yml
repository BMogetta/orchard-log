name: Release

# Versions are labels on main, not a gate: every merge still deploys (see
# deploy-cloudflare.yml). On each push to main this keeps one "release" pull
# request up to date, with the next version and a changelog worked out from the
# Conventional Commit messages since the last release. Merging that pull
# request tags the commit (vX.Y.Z) and publishes a GitHub release.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General), and a tag v1.0.0 on the commit the
# first release counts from (see CLAUDE.md).
#
# This workflow has no deploy credentials, but it runs third-party code with
# write access to the repository, so its token is kept as small as the tool
# allows. It has no permission to start workflows, and no workflow in this
# repository listens for repository_dispatch, which a token with contents:
# write could send. Keep it that way.
#
# What keeps that write access away from production:
# - The ruleset on main requires an approval from a code owner
#   (.github/CODEOWNERS), which a workflow is not, so a workflow cannot approve
#   and merge a pull request. (The setting that lets workflows open pull
#   requests also lets them approve, which is why a plain approval would not be
#   enough.)
# - The release branch is written by this workflow, so the owner reads the
#   release pull request's diff and merges that exact commit.
#
# A pull request opened with the workflow token gets its CI run in a state
# that waits for a maintainer ("Approve and run" on the pull request). That is
# how the required check gets to run on a release pull request. It is a step
# in the procedure, not a control to rely on.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Only in the canonical repository: a copy or fork should not open release
    # pull requests or cut tags of its own.
    if: github.repository == 'BMogetta/orchard-log'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and publish the release, push the release branch
      pull-requests: write # open and update the release pull request
      issues: write # create the labels release-please tracks its state with
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
