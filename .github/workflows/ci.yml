name: CI

# Runs on pull requests, including ones from forks. It gets a read-only token
# and no secrets, so the code under test has nothing to take. Actions are
# pinned to commit SHAs; Dependabot proposes the updates.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The deploy job installs this small project instead of the root one.
      # Install it here too, under the same rules, and bundle the API with
      # it, so a lockfile or a wrangler that would fail the deploy fails the
      # pull request instead.
      - name: Check the deploy tool installs and bundles the API
        run: |
          pnpm install --frozen-lockfile --dir deploy
          ./deploy/node_modules/.bin/wrangler pages functions build --outdir "$RUNNER_TEMP/functions"

      - name: Build (root base)
        run: pnpm build

      - name: Build (demo, project-page base)
        run: pnpm build
        env:
          VITE_DEMO: "1"
          BASE_PATH: "/${{ github.event.repository.name }}/"

  # The whole app in a real browser: production build, service worker, the API
  # on a throwaway database and bucket. Separate from `build` so that stays
  # fast; it has the same read-only token and no secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
