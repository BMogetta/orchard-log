name: CI

# Runs on pull requests, including ones from forks. It gets a read-only token
# and no secrets, so the code under test has nothing to take. Actions are
# pinned to commit SHAs; Dependabot proposes the updates.

on:
  push:
    branches: [main]
  pull_request:
  # Started by release.yml on the release branch, whose pull request cannot
  # trigger this workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (root base)
        run: pnpm build

      - name: Build (demo, project-page base)
        run: pnpm build
        env:
          VITE_DEMO: "1"
          BASE_PATH: "/${{ github.event.repository.name }}/"
