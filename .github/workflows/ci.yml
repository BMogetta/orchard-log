name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (root base)
        run: pnpm build

      - name: Build (demo, project-page base)
        run: pnpm build
        env:
          VITE_DEMO: "1"
          BASE_PATH: "/${{ github.event.repository.name }}/"
