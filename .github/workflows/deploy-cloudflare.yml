name: Deploy app to Cloudflare Pages

# Publishes the real app (sync on) to the Cloudflare Pages project, with its
# API and database schema. Runs on every push to main, so merging a PR is the
# release. A manual run only deploys when started from main.
#
# Settings it needs (Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   scoped to this one Cloudflare account, with
#                                   "Cloudflare Pages: Edit" and "D1: Edit".
#                                   Prefer storing it on the `production`
#                                   environment with deployments limited to
#                                   main, where the plan allows it; a
#                                   repository secret works otherwise.
#   secret   CLOUDFLARE_ACCOUNT_ID  the account id. An identifier rather than a
#                                   credential, stored as a secret only so it
#                                   is masked in these public logs.
#
# The token is powerful: Cloudflare cannot limit it to one Pages project or one
# database, so it can deploy to, read and delete every one in the account. Give
# it an expiry and rotate it.
#
# Actions are pinned to commit SHAs because a moved tag would run with access
# to that token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another and are never cancelled midway: a run applies
# database migrations before it ships the code that needs them.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  # No credentials here. Install, lint, test and build all execute third-party
  # code, so they are kept in a job that has nothing worth stealing.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The CI workflow runs these too, but in parallel with this one. Repeating
      # them here is what keeps a red main from reaching production.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SYNC: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Fresh runner: the API code and migrations come straight from the checkout,
  # and only the built static files cross over from the job above. The
  # dependency cache is not restored here on purpose.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # This job must not restore a dependency cache. The action only
          # caches automatically for npm today; kept off explicitly in case
          # that ever widens to pnpm.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Schema first: the new code may depend on it, and migrations are written
      # so the code already in production keeps working until it is replaced.
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply orchard --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `--branch main` is what makes this the production deployment; Pages
      # treats any other branch name as a preview.
      - name: Deploy
        run: pnpm exec wrangler pages deploy dist --project-name orchard-log --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
