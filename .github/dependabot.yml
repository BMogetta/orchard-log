# Keeps the pinned actions and the npm dependencies current. Updates arrive as
# pull requests, which run CI like any other and deploy only when merged.
#
# A merged update runs in the deploy job, next to the Cloudflare token (wrangler
# and its dependencies are installed there). So: a new release waits a week
# before it is proposed, which is when most malicious releases get caught, and
# major versions always come alone so they are read on their own. Read the
# lockfile diff before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Both npm projects in one entry: the app (/) and the deploy job's own small
  # project (/deploy). wrangler is in both and a test requires the two to be
  # on the same version, so it gets its own group: a group spans the listed
  # directories, which puts both bumps in one pull request.
  - package-ecosystem: npm
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      wrangler:
        patterns: ["wrangler"]
      minor-and-patch:
        update-types: [minor, patch]
