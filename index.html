<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The app makes no external network calls: all data is local (IndexedDB),
      photos render from blob: object URLs, and backup import reads data: URLs.
      This CSP locks everything to same-origin while allowing exactly those.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f5233" />
    <title>Orchard Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
